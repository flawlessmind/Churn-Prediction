services:
  # docker compose up  ->  http://localhost:8000/docs
  api:
    build: {context: ., target: runtime}
    image: churn-api:latest
    ports: ["8000:8000"]
    volumes:
      - ./models:/app/models:ro          # модель подкладывается снаружи → переобучение не требует пересборки образа
    environment:
      MODEL_PATH: /app/models/churn_model.pkl
      LOG_LEVEL: INFO
    restart: unless-stopped

  # docker compose --profile train run --rm trainer    (нужен data/raw/*.csv)
  trainer:
    profiles: ["train"]
    build: {context: ., target: trainer}
    image: churn-trainer:latest
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./mlflow:/app/mlflow
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/mlflow/mlflow.db

  # docker compose --profile mlflow up mlflow   ->  http://localhost:5000
  mlflow:
    profiles: ["mlflow"]
    image: ghcr.io/mlflow/mlflow:v2.20.3
    ports: ["5000:5000"]
    volumes: ["./mlflow:/app/mlflow"]
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////app/mlflow/mlflow.db
      --default-artifact-root /app/mlflow/artifacts
